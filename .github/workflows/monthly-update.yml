name: Monthly deadline update

# Runs a Claude Code maintenance pass over the conference dataset once a month,
# then opens a pull request against gh-pages with whatever it changed.
#
# Requirements (repo Settings -> Secrets and variables -> Actions):
#   - ANTHROPIC_API_KEY  (secret)  — used by Claude Code headless.
# And (Settings -> Actions -> General -> Workflow permissions):
#   - "Read and write permissions" enabled, and
#   - "Allow GitHub Actions to create and approve pull requests" checked.

on:
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-deadline-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Set up Ruby (for jekyll build validation)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Set up Python (for utils/ helper scripts)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps for utils
        run: pip install pyyaml beautifulsoup4 requests

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run monthly maintenance pass
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "/update-deadlines" \
            --permission-mode acceptEdits \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebSearch,WebFetch" \
            2>&1 | tee /tmp/claude-run.log

      - name: Validate dataset still builds
        run: |
          ruby -ryaml -rdate -e 'Dir.glob("_data/conferences/*.yml").each{|f| YAML.safe_load(File.read(f),permitted_classes:[Date]) }; puts "YAML OK"'
          bundle exec jekyll build

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          base: gh-pages
          branch: auto/monthly-deadline-update
          delete-branch: true
          commit-message: "Monthly deadline update (automated)"
          title: "Monthly deadline update — ${{ github.run_id }}"
          body: |
            Automated monthly maintenance pass by Claude Code (`/update-deadlines`).

            Verifies predicted deadlines against official CFPs, adds newly-announced
            editions, and refreshes stale predictions. **Review the diff and the run
            log before merging** — estimated dates are labelled `Predicted`.

            Run log is in the workflow output for this run.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          labels: |
            automated
            deadlines
